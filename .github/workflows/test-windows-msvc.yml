name: Windows Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Automatically cancel any previous workflow on new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test on Windows
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        
    - name: Install dependencies
      run: |
        pip install meson ninja
      shell: pwsh
      
    - name: Prepare MSVC
      uses: bus1/cabuild/action/msdevshell@v1
      with:
        architecture: x64  
        
    - name: Configure with MSVC
      run: |
        # Match the Linux / macOS workflows: warning_level=2 plus
        # AddressSanitizer (MSVC has supported ASan since VS 16.9). UBSan
        # isn't available on MSVC so we leave it out for this matrix
        # entry; the LLVM-clang matrix entry covers UBSan.
        meson setup build -Dwarning_level=2 -Db_sanitize=address -Db_lundef=false
      shell: pwsh

    - name: Build
      run: |
        meson compile -C build

    - name: Test
      run: |
        meson test -C build --print-errorlogs

    - name: Upload test logs
      # Always upload so we can audit which tests actually ran. Without
      # the artifact we have no way to tell a green run with N tests
      # from a green run with 0 tests.
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-windows-msvc
        path: build/meson-logs/testlog.txt
