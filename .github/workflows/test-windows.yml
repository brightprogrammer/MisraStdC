name: Windows Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build and Test on Windows
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        
    - name: Install dependencies
      run: |
        pip install meson ninja
      shell: pwsh
      
    - name: Install LLVM and Clang
      run: |
        choco install llvm --version=17.0.6
        echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: pwsh
      
    - name: Create Clang native file
      run: |
        New-Item -Path .github -ItemType Directory -Force
        @"
        [binaries]
        c = 'clang'
        cpp = 'clang++'
        ar = 'llvm-ar'
        strip = 'llvm-strip'
        objcopy = 'llvm-objcopy'
        objdump = 'llvm-objdump'
        ranlib = 'llvm-ranlib'
        "@ | Out-File -FilePath .github/windows-clang.ini -Encoding utf8
      shell: pwsh
        
    - name: Configure with Clang
      run: |
        $env:CC = "clang"
        $env:CXX = "clang++"
        meson setup builddir --native-file=.github/windows-clang.ini
      shell: pwsh
      
    - name: Build
      run: |
        ninja -C builddir
        
    - name: Test
      run: |
        ninja -C builddir test
        
    - name: Upload test logs if failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-logs-windows
        path: builddir/meson-logs/testlog.txt 