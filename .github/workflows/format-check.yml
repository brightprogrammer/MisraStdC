# Thanks for having a reliable workflow!

name: "Format Check"

on:
  push:
    branches:
    - 'master'
  pull_request:
    branches:
    - 'master'

# Automatically cancel any previous workflow on new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      clang-format: ${{ steps.filter.outputs.clang-format }}
    steps:
    - uses: actions/checkout@v5
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          clang-format:
            - '**.c'
            - '**.h'
            - '**.in'
            - '**.inc'
            - '.github/workflows/linter.yml'
            - 'Scripts/clang-format.py'
            - '.clang-format'

  clang-format:
    needs: changes
    runs-on: ubuntu-24.04
    if: ${{ needs.changes.outputs.clang-format == 'true' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install clang-format-16
      run: sudo apt --assume-yes install clang-format-16

    - name: Install Python3 and gitpython
      run: |
        sudo apt --assume-yes install python3-pip
        sudo pip3 install gitpython

    - name: Run clang-format
      run: |
        sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-16 160
        clang-format --version
        python3 Scripts/clang-format.py --check --verbose