name: Format Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  format-check:
    name: Check code formatting with clang-format
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install clang-format
      run: |
        # Install clang-format via Homebrew (matches local development environment)
        brew install clang-format
        
    - name: Check clang-format version
      run: |
        clang-format --version
        
    - name: Find C/C++ files to format
      id: find-files
      run: |
        # Find all C and header files, excluding build directories and submodules
        FILES=$(find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.hpp" \) \
                ! -path "./build*" \
                ! -path "./builddir*" \
                ! -path "./.git/*" \
                ! -path "./demangler/*" \
                ! -path "./.cache/*" \
                -print)
        echo "Found files:"
        echo "$FILES"
        echo "files<<EOF" >> $GITHUB_OUTPUT
        echo "$FILES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Check formatting
      run: |
        EXIT_CODE=0
        FILES="${{ steps.find-files.outputs.files }}"
        
        if [ -z "$FILES" ]; then
          echo "No C/C++ files found to check"
          exit 0
        fi
        
        echo "Checking formatting for files:"
        echo "$FILES"
        echo ""
        
        # Create a temporary directory for formatted files
        mkdir -p /tmp/formatted
        
        # Check each file
        for file in $FILES; do
          if [ -f "$file" ]; then
            echo "Checking $file..."
            
            # Format the file and save to temp directory
            clang-format "$file" > "/tmp/formatted/$(basename "$file")"
            
            # Compare original with formatted version
            if ! diff -u "$file" "/tmp/formatted/$(basename "$file")"; then
              echo "❌ $file is not properly formatted"
              echo "Expected changes shown above (- original, + formatted)"
              echo ""
              EXIT_CODE=1
            else
              echo "✅ $file is properly formatted"
            fi
          fi
        done
        
        if [ $EXIT_CODE -eq 0 ]; then
          echo ""
          echo "🎉 All files are properly formatted!"
        else
          echo ""
          echo "💥 Some files are not properly formatted."
          echo "To fix formatting issues, run:"
          echo "  clang-format -i <file>"
          echo "Or format all files:"
          echo "  find . -name '*.c' -o -name '*.h' | xargs clang-format -i"
        fi
        
        exit $EXIT_CODE