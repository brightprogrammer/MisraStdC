name: Format Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  format-check:
    name: Check code formatting with clang-format
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install clang-format 20
      run: |
        sudo apt-get update
        # Install dependencies for HTTPS transport
        sudo apt-get install -y software-properties-common wget gnupg lsb-release
        # Add LLVM APT repository for Clang 20
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 20
        # Cleanup
        rm llvm.sh

    - name: Check clang-format version
      run: clang-format-20 --version

    - name: Find C/C++ files to format
      id: find-files
      run: |
        FILES=$(find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.hpp" \) \
                ! -path "./build*" \
                ! -path "./builddir*" \
                ! -path "./.git/*" \
                ! -path "./demangler/*" \
                ! -path "./.cache/*" \
                -print)
        echo "Found files:"
        echo "$FILES"
        echo "files<<EOF" >> $GITHUB_OUTPUT
        echo "$FILES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Check formatting
      run: |
        EXIT_CODE=0
        FILES="${{ steps.find-files.outputs.files }}"

        if [ -z "$FILES" ]; then
          echo "No C/C++ files found to check"
          exit 0
        fi

        echo "Checking formatting for files:"
        echo "$FILES"
        echo ""

        mkdir -p /tmp/formatted

        for file in $FILES; do
          if [ -f "$file" ]; then
            echo "Checking $file..."
            formatted_file="/tmp/formatted/$file"
            mkdir -p "$(dirname "$formatted_file")"
            clang-format-20 "$file" > "$formatted_file"

            if ! diff -u "$file" "$formatted_file"; then
              echo "❌ $file is not properly formatted"
              echo "Expected changes shown above (- original, + formatted)"
              echo ""
              EXIT_CODE=1
            else
              echo "✅ $file is properly formatted"
            fi
          fi
        done

        if [ $EXIT_CODE -eq 0 ]; then
          echo ""
          echo "🎉 All files are properly formatted!"
        else
          echo ""
          echo "💥 Some files are not properly formatted."
          echo "To fix formatting issues, run:"
          echo "  clang-format-20 -i <file>"
          echo "Or format all files:"
          echo "  find . -name '*.c' -o -name '*.h' | xargs clang-format-20 -i"
        fi

        exit $EXIT_CODE
