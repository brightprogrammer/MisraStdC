name: Linux ARM64 Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.flavour }} on Ubuntu (arm64)
    runs-on: ubuntu-22.04-arm
    container:
      image: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: sanitized
            setup_args: '-Dwarning_level=2 -Db_sanitize=address,undefined -Db_lundef=false'
            verify_libc_diet: 'no'
          - flavour: freestanding
            setup_args: '-Dwarning_level=2'
            verify_libc_diet: 'yes'

    steps:
    - name: Bootstrap container (build + runtime deps)
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential nodejs git ca-certificates \
          python3 python3-pip \
          ninja-build meson binutils

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure
      run: meson setup build ${{ matrix.setup_args }}

    - name: Build
      run: ninja -C build

    - name: Test
      run: meson test -C build --print-errorlogs

    - name: Verify libc-diet (Bin/ tools have no libc undef refs)
      if: matrix.verify_libc_diet == 'yes'
      run: |
        set -e
        FAILED=0
        for bin in build/beam build/resolve; do
          if [ ! -f "$bin" ]; then
            echo "::warning::$bin not built, skipping libc-diet check"
            continue
          fi
          undef=$(nm -u "$bin" 2>/dev/null || true)
          if [ -n "$undef" ]; then
            echo "::error::$bin has undefined references (libc-diet broken):"
            echo "$undef" | sed 's/^/  /'
            FAILED=1
          else
            echo "OK: $bin has zero undefined references"
          fi
          ldd_out=$(ldd "$bin" 2>&1 || true)
          if ! echo "$ldd_out" | grep -q 'statically linked\|not a dynamic executable'; then
            echo "::error::$bin is not statically linked:"
            echo "$ldd_out" | sed 's/^/  /'
            FAILED=1
          fi
        done
        exit $FAILED

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-logs-linux-arm64-${{ matrix.flavour }}
        path: build/meson-logs/testlog.txt
