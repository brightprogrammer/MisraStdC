# Function-level classification store for Mull mutation triage.
#
# One [[function]] stanza per C function a human has classified, used by
# Scripts/mull-triage-server.py to drive per-function survivor bucketing,
# bulk cluster actions, and the ledger audit. This file does NOT suppress any
# survivor on its own; it records the triage doctrine tag for a function so the
# UI can propose (never auto-apply) what to do with that function's survivors.
#
# A missing or empty file is treated as "no functions tagged" (never an error).
#
# Doctrine (see Conventions/MULL-DISCOVERY-CONVENTIONS.md):
#   strategy  every caller treats this function's output as a hint and
#             re-validates it -> all its survivors are bucket B/C -> propose
#             Ignore-all (a function-selector ledger entry). SOUND ONLY if the
#             callers really re-validate (use the "show callers" check).
#   contract  some caller depends on this function's exact observable effect ->
#             its survivors are bucket A or C, NEVER B -> propose To-Fix, but
#             some may be unkillable equivalents (C) the human must still
#             Ignore-with-proof.
#   mixed     A/B/C varies per line -> no auto-proposal.
#
# Schema (per [[function]]):
#   file       repo-relative path to the source file (key: basename + function)
#   function   the C function name (key)
#   tag        "contract" | "strategy" | "mixed"
#   note       optional free text -- e.g. the re-validation justification for a
#              strategy tag, or which caller pins the contract
#   author     who classified it
#   created    YYYY-MM-DD (via `date +%F`)
