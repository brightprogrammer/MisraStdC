# "To Fix" worklist for Mull mutation testing.
#
# One [[todo]] stanza per surviving mutant a human has decided is a genuine
# bucket-A contract gap that deserves a killing test. Unlike the ledger
# (Conventions/mull-ignores.toml), a [[todo]] entry does NOT suppress the
# survivor: it merely moves it out of the "Remaining" triage view into a
# "To Fix" worklist so the human can track which gaps still need a test.
#
# This file is written by Scripts/mull-triage-server.py and is allowed to be
# missing or empty -- either is treated as an empty worklist.
#
# Schema (per [[todo]]):
#   file        repo-relative path to the source file (survivor key)
#   line        1-based source line of the survivor (survivor key)
#   col         column of the survivor (survivor key)
#   mutator     mull mutator id of the survivor (survivor key)
#   note        optional free text -- why / what to fix
#   created     YYYY-MM-DD (via `date +%F`)
#   region_hash "sha256:<hex>" of the single target line (lines=[line,line]);
#               stored for staleness awareness -- if it no longer matches the
#               current line the code moved and the entry is flagged stale.
