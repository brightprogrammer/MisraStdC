id = "MAP-872C58"
file = "Source/Misra/Std/Container/Map.c"
lines = [959, 959]
mutator = "cxx_lt_to_le"
bucket = "B"
rationale = "Loop bound `attempt < 32` -> `attempt <= 32`, giving 33 instead of 32 grow attempts. The loop body always breaks via line 975 the moment map_scan_slots finds a slot; a successful insert never depends on reaching the cap. `<=32` only grants one EXTRA recovery attempt, so it can never turn a successful insert into a failure - at worst it delays the LOG_FATAL at line 1004 that only fires after 32 consecutive forced doublings (each at least doubling capacity, making it effectively unreachable). The 32 value is an implementation-chosen safety cap; the documented contract (insert succeeds when a slot exists) is unchanged."
author = "proposals"
created = "2026-06-10"
region_hash = "sha256:ab7e0aa504420a845a9349f5140560c29c15db2f1d3c14757ac2f9ca8ec507bb"

[[ignore]]
id = "MAP-003"
file = "Source/Misra/Std/Container/Map.c"
lines = [959, 959]
mutator = "cxx_post_inc_to_post_dec"
bucket = "B"
rationale = "`attempt++` -> `attempt--`. The loop exit is data-driven (break at line 975 once a slot is found), not counter-driven: every reachable insert breaks on iteration 0 or after a few genuine grows, so the counter direction is unobservable. The counter only serves as the 32-attempt safety cap; decrementing it disables that cap, changing the failure mode of an UNREACHABLE pathological case (each of 32 doublings failing to find a slot) from LOG_FATAL to a hang. No reachable input distinguishes it, and no successful insert is turned into a failure or a wrong value. The cap is an implementation-chosen bound."
author = "proposals"
created = "2026-06-10"
region_hash = "sha256:ab7e0aa504420a845a9349f5140560c29c15db2f1d3c14757ac2f9ca8ec507bb"

