bucket      = "C"
rationale   = "In _read_f32, `StrIterIndex(&si) > StrIterIndex(&saved)` gates the exponent-introducer path. > vs >= only diverge when si==saved, i.e. the FIRST token char is 'e'/'E'. Any such leading-'e' token has no mantissa digit, and StrToF64 returns false unless have_digits is set (Str.c:1139), and have_digits is set ONLY by integer/fractional mantissa digits (Str.c:1078,1089), never by exponent digits. Traced all sub-cases (\"e\",\"e5\",\"e+5\",\"e.5\"): every one fails StrToF64, hits the error return of `start` (computed from the fixed saved index, identical in both variants) with *v left unwritten. So both > and >= yield the identical observable outcome (error, return start, *v unchanged). Equivalent."
