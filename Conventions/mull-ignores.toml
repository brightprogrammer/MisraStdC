rationale = "clone_vec's `reserve_pow2_vec(dst, item_size, src->length)` is a pre-reserve optimization: it grows dst once up-front so the per-element insert loop (185-188) does not repeatedly realloc. Replacing the call with a constant skips the pre-reserve, but each subsequent insert_range_into_vec reserves on demand, so the clone still yields identical dst contents and length -- only the number of intermediate reallocations differs. Observably equivalent; performance-only."
