id = "MAP-93E25F"
file = "Source/Misra/Std/Container/Map.c"
lines = [948, 948]
mutator = "cxx_add_to_sub"
bucket = "C"
rationale = "Line 948 passes n=map->length+1 as the grow target to rehash_map. Mutated to map->length-1. When inserting into a map whose entries were all removed (length 0, tombstones>0 at small capacity, e.g. insert 5 then remove all 5 at capacity 8), should_rehash returns true via the (length+tombstones+pending)*4>=capacity*3 path. Then length-1 == 0-1 underflows to UINT64_MAX. next_capacity sees needed=max(UINT64_MAX,0)=UINT64_MAX > max_needed and returns 0, so rehash_map (line 525-526) hits LOG_FATAL 'insufficient capacity'. A valid insert crashes."
author = "proposals"
created = "2026-06-10"
region_hash = "sha256:84adb73e765a90153ab05f8a8619c7263fa17cf1f7c699f4f7ce675ed27702a6"

