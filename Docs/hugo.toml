baseURL = "https://docs.brightprogrammer.in"
title = "MisraStdC"
timeZone = "Asia/Kolkata"

enableRobotsTXT = true
enableGitInfo = true
hasCJKLanguage = false
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
summaryLength = 20

[services]
[services.googleAnalytics]
ID = "G-MEASUREMENT_ID"

[permalinks.page]
"pages" = "/:slug/"

[outputs]
home = ["html", "rss"]
page = ["html"]
section = ["html", "rss"]

[markup]
[markup.highlight]
noClasses = false
lineNumbersInTable = false

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)']]

[markup.tableOfContents]
startLevel = 2
endLevel = 5
ordered = true

[imaging]
quality = 80
resampleFilter = "Lanczos"

[params]
description = "Reference documentation for MisraStdC, a personal standard C library focused on generic, type-safe, cross-platform utilities."
externalLinkDecoration = true
displayUpdatedDate = true
displayUpdatedAuthor = false
dateFormat = "January 2, 2006"

[params.navbar]
displayTitle = true
displayLogo = false
width = "wide"

[params.theme]
default = "system"
displayToggle = true

[params.footer]
enable = true
displayCopyright = true
displayPoweredBy = false
width = "wide"

[params.search]
enable = true
type = "flexsearch"

[params.search.flexsearch]
index = "content"
tokenize = "forward"

[params.editURL]
enable = true
base = "https://github.com/brightprogrammer/MisraStdC/edit/master/Docs/content"

[params.toc]
displayTags = true

[params.highlight.copy]
enable = true
display = "hover"

[params.page]
width = "normal"
